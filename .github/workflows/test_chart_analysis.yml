name: Test Chart Analysis

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: '분석할 이미지 경로 (repo 내 경로, 기본값: samples/sample_chart.png)'
        required: false
        default: 'samples/sample_chart.png'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/analyze_chart.py "${{ github.event.inputs.image_path }}"
