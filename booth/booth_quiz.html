.coin img{width:32px;height:32px;border-radius:50%;background:var(--bg-2);flex:none}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.stamp .chk{font-size:34px;font-weight:800;line-height:1}
.stamp .t1{font-size:30px;font-weight:800;letter-spacing:.1em;margin-top:2px}

  l_drv:[" — what drove it<br>to No.1?","CLM combines three scores.",[["On-chain","active wallets · tx count · exchange flows"],["Social","mentions · sentiment"],["Momentum","price trend · RSI · volume"]],"No.1 driver"," score dominated"],
  types:[["🐋 Whale","The market follows you. Ask our data team about jobs."],["✂️ Profit-taker","Knows enough, exits in time. Respect."],["🪨 HODLer","Not sure, but holds on. Gets there eventually."],["💧 XRP Believer","Fooled by Ripple again… buys again anyway."],["🚀 To the Moon","Buys first, thinks later. Happy either way."],["🌊 Dip Buyer","Caught today, buying the dip tomorrow."],["🐮 Rookie","No worries — that's what this booth is for. One more?"]]}
};
function L(k){return T[LANG][k]}
function setLang(l){LANG=l;$("brand").innerHTML=l==="ko"?"블록미디어 <b>코생지</b> 퀴즈":"Blockmedia <b>CLM</b> Quiz";$("lk").className="lang"+(l==="ko"?" on":"");$("le").className="lang"+(l==="en"?" on":"");
  $("i_h1").innerHTML=L("h1");$("i_lead").innerHTML=L("lead");$("rule").textContent=L("rule");$("i_start").textContent=L("start");$("q1tag").textContent=L("q1tag");
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=L(e.getAttribute("data-t"))});
  POOL=(LANG==="en"?(window.QUIZ_POOL_EN&&window.QUIZ_POOL_EN.questions):(window.QUIZ_POOL&&window.QUIZ_POOL.questions))||[];}

var brief=DEMO, POOL=[];
fetch(BRIEF_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){brief=d}).catch(function(){});

function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function logo(sym){return "https://static.upbit.com/logos/"+sym+".png"}
function drv(t){var m={ONCHAIN:0,MOMENTUM:2,SOCIAL:1};var i=m[t.driver];if(i==null)i=({"온체인":0,"소셜":1,"모멘텀":2})[t.driver_kr]||1;return L("l_drv")[2][i][0]}


/* ===== 라이브 문제 (매 판 3종 중 하나) ===== */
function makeLive(){
  var top=brief.top10, t1=top[0], kinds=["top1","rank","driver"], k=kinds[Math.floor(Math.random()*kinds.length)];
  if(k==="top1"){
    var s1=L("l_top1");return {kind:k,t:s1[0],l:s1[1],answer:t1.symbol,
      render:function(){var g=document.createElement("div");g.className="grid";shuffle(top).forEach(function(c){var b=document.createElement("button");b.className="coin";b.innerHTML='<img src="'+logo(c.symbol)+'" alt="" onerror="this.style.visibility=\'hidden\'"><span class="sym">'+c.symbol+'</span>';b.onclick=function(){pick(g,b);ans[1]=c.symbol};g.appendChild(b)});return g},
      check:function(v){return v===t1.symbol},label:s1[2],show:t1.symbol,why:t1.symbol+(LANG==="ko"?" — "+t1.comment+" (코생지 ":" (CLM ")+t1.clm.toFixed(2)+")"};
  }
  if(k==="rank"){
    var m=shuffle(brief.majors||[])[0]||{symbol:"ETH",rank:(top.filter(function(x){return x.symbol==="ETH"})[0]||{rank:5}).rank};
    var s2=L("l_rank");return {kind:k,t:m.symbol+s2[0],l:s2[1],answer:m.rank,
      render:function(){var d=document.createElement("div");d.innerHTML='<div class="stepper"><button onclick="bump(-1)">−</button><div class="rank"><b id="rk">5</b><span>'+s2[3]+'</span></div><button onclick="bump(1)">+</button></div><div class="scale"><span>'+s2[4]+'</span><span>'+s2[5]+'</span></div>';ans[1]=5;return d},
      check:function(v){return Math.abs(v-m.rank)<=1},label:m.symbol+s2[6],show:m.rank+s2[2],why:(LANG==="ko"?"오늘 "+m.symbol+"은 "+m.rank+"등 ":m.symbol+" is #"+m.rank+" today ")+s2[7]};
  }
  var s3=L("l_drv");return {kind:k,t:(LANG==="ko"?"1위 "+t1.symbol:t1.symbol)+s3[0],l:s3[1],answer:drv(t1),
    render:function(){var d=document.createElement("div");d.className="opts";s3[2].forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.innerHTML="<i>"+"ABC"[i]+"</i><div>"+o[0]+"<div style='font-size:14px;color:var(--ink-3);font-weight:400'>"+o[1]+"</div></div>";b.onclick=function(){pick(d,b);ans[1]=o[0]};d.appendChild(b)});return d},
    check:function(v){return v===drv(t1)},label:s3[3],show:drv(t1),why:drv(t1)+" "+Math.max(t1.contrib.onchain,t1.contrib.social,t1.contrib.momentum)+"%"+s3[4]};
}
function poolQ(n,exclude){var c=POOL.filter(function(q){return exclude.indexOf(q.cat)<0||exclude.length>=3});return shuffle(c).slice(0,n)}

/* ===== 진행 ===== */
var ans={},step=0,live=null,qs=[],rank=5,idleT=null,t0=0,attempt=0;
function pick(wrap,el){wrap.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")});el.classList.add("sel");$("e"+step).textContent=""}
function bump(d){rank=Math.min(10,Math.max(1,rank+d));$("rk").textContent=rank;ans[1]=rank}
function setProgress(n){step=n;$("prog").style.width=(n/4*100)+"%";$("stepnum").textContent=n>=1&&n<=3?n+" / 3":(n===4?"완료":"")}
function go(n){$("s"+step).classList.remove("on");$("s"+n).classList.add("on");setProgress(n);window.scrollTo(0,0);$("quit").style.display=(n>0&&n<4)?"":"none";touch()}
function start(){
  ans={};rank=5;live=makeLive();t0=Date.now();attempt++;
  var lv=PRO?["normal","hard"]:["easy","normal"];qs=lv.map(function(l){var c=POOL.filter(function(q){return (q.level||"normal")===l});return shuffle(c.length?c:POOL)[0]});
  $("q1t").innerHTML=live.t;$("q1l").textContent=live.l;$("q1body").innerHTML="";$("q1body").appendChild(live.render());
  [2,3].forEach(function(n,i){var q=qs[i];$("q"+n+"c").textContent=L("cats")[q.cat]||"Quiz";$("q"+n+"t").textContent=q.q;var o=$("q"+n+"o");o.innerHTML="";q.options.forEach(function(opt,k){var b=document.createElement("button");b.className="opt";b.innerHTML="<i>"+"ABCD"[k]+"</i><span>"+opt+"</span>";b.onclick=function(){pick(o,b);ans[n]=k};o.appendChild(b)})});
  go(1);
}
function next(n){
  if(ans[n]==null){$("e"+n).textContent=L("pick");return}
  if(n<3){go(n+1);return}
  var r=[{q:live.label,a:live.show,ok:live.check(ans[1]),why:live.why},
         {q:qs[0].q,a:qs[0].options[qs[0].answer],ok:ans[2]===qs[0].answer,why:qs[0].why},
         {q:qs[1].q,a:qs[1].options[qs[1].answer],ok:ans[3]===qs[1].answer,why:qs[1].why}];
  var s=r.filter(function(x){return x.ok}).length, code=String(Math.floor(1000+Math.random()*9000)), win=s>=PRIZE_MIN;
  var sec=(Date.now()-t0)/1000, ty=investorType(s,sec,r);
  $("type").innerHTML='<small>'+L("typelbl")+'</small><b>'+ty.n+'</b><span>'+ty.d+'</span>';
  $("score").textContent=s;$("code").textContent=code;$("codebox").className="code"+(win?" win":"");
  var canRetry=!win&&attempt<=RETRY;
  $("stamp").style.display=(win&&!SHOW_CODE)?"":"none";$("codebox").style.display=(win&&SHOW_CODE)?"":"none";$("retry").style.display=win?"none":"";
  $("stampsub").textContent=s===3?L("clear"):L("showstaff");
  $("retry_t").textContent=canRetry?L("close"):L("nomore");
  $("retry_s").textContent=canRetry?L("retrys"):L("nomores");
  $("btn_retry").style.display=canRetry?"":"none";$("btn_next").style.display=canRetry?"none":"";
  $("codelbl").textContent=win?"굿즈 인증코드":"참여 코드";$("codesub").textContent=win?"스태프에게 이 화면을 보여주세요":"아쉽지만 다음 기회에! 한 번 더 도전해도 돼요";
  if(PRIZE_MIN===0)$("codesub").textContent=s===3?"올 클리어! 스태프에게 보여주세요":"참여 감사해요! 스태프에게 보여주세요";
  $("answers").innerHTML=r.map(function(x){return '<div class="ans"><div class="h"><div class="m '+(x.ok?"ok":"no")+'">'+(x.ok?"✓":"✕")+'</div><div class="q">'+x.q+'</div><div class="a">'+x.a+'</div></div><div class="why">'+x.why+'</div></div>'}).join("");
  $("ai").textContent=LANG==="ko"?((brief.summary&&(brief.summary.focus||brief.summary.market))||""):("No.1 today: "+brief.top10[0].symbol+" (CLM "+brief.top10[0].clm.toFixed(2)+", driven by "+drv(brief.top10[0]).toLowerCase()+")");$("asof").textContent=brief.updated_date||brief.as_of_date||"";
  go(4); save({code:code,score:s,live_kind:live.kind,live_answer:String(ans[1]),q2:qs[0].id,q3:qs[1].id,win:win}); startIdle();
}
function reset(){attempt=0;setLang("ko");clearTimeout(idleT);$("idle").style.transition="none";$("idle").style.width="0";go(0);document.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")})}
function startIdle(sec){sec=sec||IDLE_SEC;clearTimeout(idleT);var b=$("idle");b.style.transition="none";b.style.width="0";void b.offsetWidth;b.style.transition="width "+sec+"s linear";b.style.width="100%";idleT=setTimeout(reset,sec*1000)}
function touch(){if(step===4)startIdle(IDLE_SEC);else if(step>0)startIdle(IDLE_MID_SEC)}
document.addEventListener("pointerdown",touch);

/* ===== 코인 유형 ===== */
function investorType(s,sec,r){
  var xrp=String(ans[1]).indexOf("XRP")>=0, fast=sec<25, t=L("types"), i;
  if(s===3)i=0;else if(s===2&&fast)i=1;else if(s===2)i=2;else if(s===1&&xrp)i=3;else if(s===1&&fast)i=4;else if(s===1)i=5;else i=6;
  return {n:t[i][0],d:t[i][1]};
}

/* ===== 저장 (Supabase 설정 시) ===== */
function save(row){
  if(!SUPABASE.url||!SUPABASE.key)return;
  fetch(SUPABASE.url+"/rest/v1/"+SUPABASE.table,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE.key,Authorization:"Bearer "+SUPABASE.key,Prefer:"return=minimal"},body:JSON.stringify(row)}).catch(function(){});
}
setLang("ko");
setProgress(0);
</script>
</body>
</html>
