<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블록미디어 부스 키오스크 — 마켓랩 + 코생지</title>
<style>
html,body{margin:0;height:100%;background:#0f1622;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s}
iframe.on{opacity:1}
</style>
</head>
<body>
<iframe id="a"></iframe>
<iframe id="b"></iframe>
<script>
/* 마켓랩 11화면 → 코생지 8화면 → 반복. 화면당 DUR초. ?lang=en / ?theme=light 그대로 전달. ← → 수동, L 언어, D 테마 */
var DUR=15000;
var q=location.search; if(q.indexOf("theme=light")>=0)document.body.style.background="#fff";
var pages=[{el:document.getElementById("a"),src:"marketlab_kiosk.html"+q,n:11},{el:document.getElementById("b"),src:"kosaengji_kiosk.html"+q,n:8}];
pages.forEach(function(p){p.el.src=p.src});
var pi=0,si=0;
function paint(){var p=pages[pi];try{if(p.el.contentWindow.show)p.el.contentWindow.show(si)}catch(e){}p.el.classList.add("on");pages[1-pi].el.classList.remove("on")}
function step(){si++;if(si>=pages[pi].n){si=0;pi=1-pi}paint()}
function back(){si--;if(si<0){pi=1-pi;si=pages[pi].n-1}paint()}
window.addEventListener("load",function(){setTimeout(paint,800)});
setInterval(step,DUR);
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")step(); if(e.key==="ArrowLeft")back();
  if(e.key==="l"||e.key==="L"||e.key==="d"||e.key==="D")pages.forEach(function(p){try{p.el.contentDocument.dispatchEvent(new p.el.contentWindow.KeyboardEvent("keydown",{key:e.key}))}catch(x){}});
});
</script>
</body>
</html>
