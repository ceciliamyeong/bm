<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>marketlab kiosk — KO/EN</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s}
iframe.on{opacity:1}
</style>
</head>
<body>
<iframe id="a"></iframe>
<iframe id="b"></iframe>
<script>
/* 같은 화면을 한국어 → 영어 순으로 보여주고 다음 화면으로. 각 언어 DUR초. ?theme=dark 지원, ← → 키로 수동 이동 */
var DUR=12000, SLIDES=11;
var q=location.search.indexOf("theme=dark")>=0?"?theme=dark":"";
if(q)document.body.style.background="#0f1622";
var A=document.getElementById("a"),B=document.getElementById("b");
A.src="marketlab_kiosk.html"+q; B.src="marketlab_kiosk_en.html"+q;
var i=0, en=false, frames=[A,B];
function paint(){
  var f=en?B:A, o=en?A:B;
  try{ if(f.contentWindow.show) f.contentWindow.show(i); }catch(e){}
  f.classList.add("on"); o.classList.remove("on");
}
function step(){ if(en){ i=(i+1)%SLIDES; en=false; } else { en=true; } paint(); }
function back(){ if(en){ en=false; } else { i=(i-1+SLIDES)%SLIDES; en=true; } paint(); }
window.addEventListener("load",function(){ setTimeout(paint,600); });
setInterval(step,DUR);
document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight")step(); if(e.key==="ArrowLeft")back(); if(e.key==="d"||e.key==="D")frames.forEach(function(f){try{var h=f.contentDocument.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"":"dark"}catch(x){}}); });
</script>
</body>
</html>
